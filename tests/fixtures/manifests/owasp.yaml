manifest_version: "1.0.0"
source_id: owasp_cheatsheets
query_aliases:
  - owasp
  - security
parser: markdown
scope:
  base_dir: "security/owasp-cheatsheets"
  include:
    - "Authentication_Cheat_Sheet.md"
    - "REST_Security_Cheat_Sheet.md"
    - "Input_Validation_Cheat_Sheet.md"
  exclude:
    - "Automotive_*"
chunking_policy:
  semantic_unit: list_item
  include_parent_context: true
  group_by_heading: true
validity:
  status: active
rationale: "OWASP cheatsheets pour tests sécurité"
approved_by: security-committee
approved_date: "2026-07-15"
