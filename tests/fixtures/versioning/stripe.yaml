# Override de versioning pour la source "stripe" (raw/specs-api/stripe/).
# Seule exception à la découverte 100% automatique des sources — ce fait ne
# peut pas être déduit sans risque réel de mal ordonner les versions (voir
# discussion de session : tri alphabétique/numérique naïf peut se tromper,
# ex. "v10" < "v9" alphabétiquement).
pattern: 'spec3-(?P<version>.+)\.yaml'
order:
  - legacy
  - v2213
  - v2293
  - v2323
