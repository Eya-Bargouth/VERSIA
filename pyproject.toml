[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-rag"
version = "2.1.0"
description = "TRADE — Hybrid RAG for versioned technical documentation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "qdrant-client>=1.9.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "PyYAML>=6.0.1",
    "markdown-it-py>=3.0.0",
    "transformers>=4.41.0",
    "torch>=2.3.0",
    "sentence-transformers>=3.0.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ragas>=0.1.0",
    "docling>=1.0.0; platform_system != 'Linux' or platform_machine != 'aarch64'",
    "pdfplumber>=0.11.0",
    "unstructured>=0.14.0",
    "numpy>=1.26.0",
    "FlagEmbedding>=1.2.0",
]

[project.optional-dependencies]
dev = ["black", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "phase1: Phase 1 tests",
    "phase2: Phase 2 tests",
    "phase3: Phase 3 tests",
    "phase4: Phase 4 tests",
    "phase5: Phase 5 tests",
    "phase6: Phase 6 tests",
    "slow: slow tests requiring real models and external services (excluded by default)",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
