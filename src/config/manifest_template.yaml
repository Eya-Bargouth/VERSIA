# Template générique de manifeste de source pour TRADE
# Copier ce fichier, le remplir, et le placer dans le répertoire de manifestes.

manifest_version: "1.0.0"
source_id: <identifiant_unique_snake_case>
# Mots-clés optionnels utilisés par le QueryPlanner pour détecter cette source
# à partir d'une requête utilisateur (ex: "stripe" -> source_id=stripe_specs).
# Facultatif — laisser vide si aucune détection par mot-clé n'est souhaitée.
query_aliases: []
parser: <docling|yaml_structured|markdown|json>

scope:
  include:
    - "*.md"
    - "*.yaml"
  exclude:
    - "*README*"
    - "*test*"

chunking_policy:
  semantic_unit: <api_endpoint|paragraph|list_item|table|document|code_block|heading>
  include_parent_context: true
  group_by_heading: false
  group_nested: []
  preserve_numbering: false
  reformulate_natural: false
  include_parameters: false
  include_responses: false

versioning:
  strategy: <none|filename_pattern|directory_pattern|header_pattern>
  pattern: <regex_optionnel>
  order: []

validity:
  valid_from: "2024-01-01"
  valid_until: null
  status: active

rationale: "<justification du scope et de la politique>"
approved_by: "<identifiant>"
approved_date: "2024-01-01"
