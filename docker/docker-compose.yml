services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: trade-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: trade-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: trade-api
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=trade-qdrant
      - QDRANT_PORT=6333
      # trade-redis n'est pas déclaré dans ce compose (démarré séparément),
      # mais rejoint le même réseau docker_default — joignable par nom.
      # Sans ceci, QueryCache tentait localhost:6379, qui à l'intérieur du
      # conteneur pointe sur lui-même, jamais sur trade-redis : le cache
      # était donc silencieusement désactivé pour toute requête passée par
      # ce conteneur (dégradation par conception, voir src/api/cache.py) —
      # constaté en conditions réelles (connexion refusée systématique).
      - REDIS_HOST=trade-redis
      - REDIS_PORT=6379
      - LLM_BASE_URL=http://trade-ollama:11434
      - LLM_PROVIDER=ollama
      - LLM_MODEL=qwen2.5:3b-instruct
      - QDRANT_COLLECTION_NAME=trade_chunks
      - EMBEDDING_MODEL=BAAI/bge-m3
      - RERANKER_MODEL=BAAI/bge-reranker-v2-m3
      - CHUNK_CONTEXTUAL_PREFIX_MAX_TOKENS=100
      - RAW_DATA_DIR=./raw
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    depends_on:
      - qdrant
      - ollama
    volumes:
      - ../src:/app/src:ro
      - ../tests:/app/tests:ro
      - ../scripts:/app/scripts:ro
      # Écrit en rw (pas :ro) depuis l'ajout de POST /ingest/upload — seul
      # écrivain de raw/ dans tout le projet, action utilisateur explicite
      # via l'UI (voir CLAUDE.md, invariant "raw/ lecture seule").
      - ../raw:/app/raw
      - ../data/diffs:/app/data/diffs:ro
      # Cache HuggingFace de l'hôte, réutilisé tel quel (:ro — le conteneur
      # ne doit jamais y écrire) : sans ce montage, chaque recreate du
      # conteneur repartait d'un cache vide et retéléchargeait ~8GB
      # (BGE-M3 + reranker) alors que ces poids sont déjà présents côté
      # hôte (utilisés par tous les scripts de diagnostic de cette session).
      - C:/Users/USER/.cache/huggingface:/root/.cache/huggingface:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  qdrant_storage:
  ollama_data:
